# CI for the MST proof-anchoring integration (everything under mst/).
#
# The load-bearing job is the cross-language vector gate: the Go
# implementation (mst/canonical), the TypeScript reference
# (mst/testvectors/reference-ts), and Solidity's own abi.encode (Hardhat
# vector tests) must all agree byte-identically on mst/testvectors/vectors.json.
# If any implementation diverges, the build fails.
name: MST Anchoring

on:
  push:
    branches: ["mst-integration-*"]
    paths:
      - "mst/**"
      - "internal/pkg/mstanchor/**"
      - "internal/peer/node/**"
      - "integration/mst/**"
      - "core/scc/mstscc/**"
      - "go.mod"
      - ".github/workflows/mst.yml"
  pull_request:
    paths:
      - "mst/**"
      - "internal/pkg/mstanchor/**"
      - "internal/peer/node/**"
      - "integration/mst/**"
      - "core/scc/mstscc/**"
      - "go.mod"
      - ".github/workflows/mst.yml"

permissions:
  contents: read

jobs:
  go-canonical:
    name: Go canonical encoding + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: mst/canonical/go.sum
      - name: go vet
        working-directory: mst/canonical
        run: go vet ./...
      - name: go test (unit + vectors)
        working-directory: mst/canonical
        run: go test -race -count=1 ./...
      - name: fuzz canonicity (short)
        working-directory: mst/canonical
        run: go test -run '^$' -fuzz FuzzDecodeReEncode -fuzztime 30s

  go-modules:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - fabric-chaincode/proofhelper
          - fabric-chaincode/example-chaincode
          - fabric-chaincode/anchor-status
          - relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: mst/${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: mst/${{ matrix.module }}
        run: go vet ./...
      - name: go build
        working-directory: mst/${{ matrix.module }}
        run: go build ./...
      - name: go test
        working-directory: mst/${{ matrix.module }}
        run: go test -race -count=1 ./...

  ts-reference-vectors:
    name: TypeScript reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mst/testvectors/reference-ts/package-lock.json
      - name: install
        working-directory: mst/testvectors/reference-ts
        run: npm ci
      - name: vectors
        working-directory: mst/testvectors/reference-ts
        run: npm test

  anchor-contracts:
    name: Anchor contract + EVM vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mst/anchor-contracts/package-lock.json
      - name: install
        working-directory: mst/anchor-contracts
        run: npm ci
      - name: compile
        working-directory: mst/anchor-contracts
        run: npx hardhat compile
      - name: test
        working-directory: mst/anchor-contracts
        run: npx hardhat test
      - name: exported ABI is current
        working-directory: mst/anchor-contracts
        run: |
          npm run abi
          git diff --exit-code abi/

  outbox-couchdb:
    name: Outbox contract suite vs real CouchDB
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: adminpw
        ports:
          - 5984:5984
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: mst/relay/go.sum
      - name: wait for couchdb
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5984/_up > /dev/null && exit 0
            sleep 1
          done
          echo "couchdb did not come up" >&2; exit 1
      - name: backend contract suite (authoritative CouchDB run)
        working-directory: mst/relay
        env:
          MST_COUCHDB_URL: http://127.0.0.1:5984
          MST_COUCHDB_USER: admin
          MST_COUCHDB_PASSWORD: adminpw
        run: go test -count=1 -v -run TestCouchDBStoreContract ./outbox/

  embedded-peer:
    name: Peer with embedded anchoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: mstanchor unit tests
        run: go test -race -count=1 ./internal/pkg/mstanchor/...
      - name: peer node package tests
        run: go test -count=1 ./internal/peer/node/...
      - name: build the peer binary and prove it runs (no proto conflicts)
        run: |
          go build -o /tmp/peer ./cmd/peer
          /tmp/peer version

  evm-integration:
    name: Relayer vs live EVM node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mst/anchor-contracts/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: mst/relay/go.sum
      - name: install contracts toolchain
        working-directory: mst/anchor-contracts
        run: npm ci
      - name: start hardhat node
        working-directory: mst/anchor-contracts
        run: |
          npx hardhat node > /tmp/hardhat.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","id":1}' \
              http://127.0.0.1:8545 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "hardhat node did not come up" >&2; cat /tmp/hardhat.log >&2; exit 1
      - name: integration test (submit/confirm/idempotency/sender pipeline)
        working-directory: mst/relay
        env:
          MST_EVM_RPC: http://127.0.0.1:8545
        run: go test -count=1 -run TestIntegration -v ./evm/

  writeback-network:
    name: Write-back on a real network (nwo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      # The suite stands up a real orderer + peers via nwo and drives the mstscc
      # write-back end to end (endorse -> order -> commit -> validate). It uses
      # only the built-in mstscc (no user chaincode), so it needs the Docker
      # daemon (present on ubuntu-latest) but not the ccenv/baseos images. If a
      # future change deploys a user chaincode here, switch to
      # `make integration-test INTEGRATION_TEST_SUITE=mst`.
      - name: write-back integration suite
        run: ./scripts/run-integration-tests.sh mst
